name: ci

# Pull requests are checked once via pull_request; pushes only trigger on master
# (post-merge confirmation) and release tags, so a PR commit is not built twice.
on:
  push:
    branches: ["master"]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run pytest -q
      - name: Installer dry run
        run: bash scripts/install.sh --dry-run
