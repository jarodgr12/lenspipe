[project]
name = "lenspipe"
version = "2.0.6"
description = "DifMAP spectral pipeline for multi-epoch lensed-image spectra: self-calibration, per-channel model fitting, science plots, and a local job console."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "astropy>=6.0",
    "pydantic>=2.6",
    "typer>=0.12",
    "nicegui>=2.0",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
emcee = ["emcee>=3.1"]

[project.scripts]
lenspipe = "lenspipe.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lenspipe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["legacy", "casa"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
